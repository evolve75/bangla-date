[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bangla-date"
dynamic = ["version"]
description = "Convert Gregorian dates to Bangla dates and print the current Bangla date."
authors = [{name = "Anupam Sengupta", email = "anupamsg@gmail.com"}]
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bangla", "bengali", "calendar", "date", "converter", "bangabda"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
bangla-date = "bangla_date.__main__:main"

[project.urls]
Homepage = "https://github.com/evolve75/bangla-date"
Repository = "https://github.com/evolve75/bangla-date"
Issues = "https://github.com/evolve75/bangla-date/issues"
Changelog = "https://github.com/evolve75/bangla-date/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16",
]

[tool.hatch.version]
path = "bangla_date/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["bangla_date"]

[tool.hatch.build.targets.sdist]
include = [
    "/bangla_date",
    "/tests",
    "/tools",
    "/FORMULAS.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W"]
